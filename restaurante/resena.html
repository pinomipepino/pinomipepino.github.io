<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Tu Nombre">
    <meta name="description" content="Formulario de reseña">
    <meta name="keywords" content="reseña, plato">
    <title>Reseña de un plato - Casa Frasco</title>
    <style>
        body {
            background-color: #f4f1ea;
            font-family: Arial, sans-serif;
            color: #333;
        }
        h1 {
            color: #ffb7b2; /* Rosa pastel */
        }
        fieldset {
            background-color: #ffffff;
            border: 2px solid #ffb7b2; /* Borde rosa pastel */
            padding: 15px;
        }
        legend {
            color: #ffb7b2;
            font-weight: bold;
        }
        input, textarea, select {
            margin-bottom: 10px;
            padding: 5px;
            background-color: #fafafa;
            border: 1px solid #ccc;
        }
        button {
            background-color: #ffd3b6; /* Melocotón pastel */
            padding: 10px 20px;
            border: 1px solid #ffcba4;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>Deja tu reseña</h1>
    </header>
    <nav>
        <ul>
            <li><a href="../index.html">Volver al menú principal</a></li>
            <li><a href="index.html">Volver al restaurante</a></li>
        </ul>
    </nav>
    <main>
        <form action="#" method="post">
            <fieldset>
                <legend>Opinión sobre nuestros platos</legend>
                <label for="plato">Selecciona el plato:</label><br>
                <select id="plato" name="plato" required>
                    <option value="">-- Elige un plato --</option>
                    <option value="plato1">Paella</option>
                    <option value="plato2">Tortilla de patatas</option>
                    <option value="plato3">Torrezno de Soria</option>
                </select><br>
                <label for="nombre_resena">Tu nombre:</label><br>
                <input type="text" id="nombre_resena" name="nombre_resena" required><br>
                <label for="texto_resena">Tu reseña:</label><br>
                <textarea id="texto_resena" name="texto_resena" rows="5" required></textarea><br>
                <button type="submit">Enviar Reseña</button>
            </fieldset>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Javier Gonzalez Jimenez - Casa Frasco</p>
    </footer>
</body>
</html>
