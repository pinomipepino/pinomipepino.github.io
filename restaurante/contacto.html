<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Tu Nombre">
    <meta name="description" content="Formulario de contacto de Casa Frasco">
    <meta name="keywords" content="contacto, restaurante, Casa Frasco">
    <title>Contacto - Casa Frasco</title>
</head>
<body>
    <header>
        <h1>Contacta con nosotros</h1>
    </header>
    <nav>
        <ul>
            <li><a href="../index.html">Volver al menú principal</a></li>
            <li><a href="index.html">Volver al restaurante</a></li>
        </ul>
    </nav>
    <main>
        <form action="#" method="post">
            <fieldset>
                <legend>Formulario de Contacto</legend>
                
                <label for="nombre">Nombre completo:</label><br>
                <input type="text" id="nombre" name="nombre" required><br><br>
                
                <label for="email">Correo electrónico:</label><br>
                <input type="email" id="email" name="email" required><br><br>
                
                <label for="asunto">Asunto:</label><br>
                <input type="text" id="asunto" name="asunto"><br><br>
                
                <label for="mensaje">Mensaje:</label><br>
                <textarea id="mensaje" name="mensaje" rows="5" cols="40" required></textarea><br><br>
                
                <button type="submit">Enviar Mensaje</button>
            </fieldset>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Tu Nombre - Casa Frasco</p>
    </footer>
</body>
</html>
