<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Tu Nombre">
    <meta name="description" content="Formulario de solicitud">
    <meta name="keywords" content="solicitud, acceso">
    <title>Solicitud de Acceso</title>
    <style>
        body {
            background-color: #f4f1ea;
            font-family: Arial, sans-serif;
            color: #333;
        }
        h1 {
            color: #a8e6cf; /* Verde menta pastel */
        }
        fieldset {
            background-color: #ffffff;
            border: 2px solid #a8e6cf; /* Borde verde menta */
            padding: 15px;
            margin-bottom: 15px;
        }
        legend {
            color: #8fd3b8; /* Verde un poco más oscuro */
            font-weight: bold;
        }
        input, select {
            margin-bottom: 10px;
            padding: 5px;
            background-color: #fafafa;
            border: 1px solid #ccc;
        }
        button {
            background-color: #ffd3b6; /* Melocotón pastel */
            padding: 10px 20px;
            border: 1px solid #ffcba4;
            cursor: pointer;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Solicitud de Acceso</h1>
    </header>
    <nav>
        <ul>
            <li><a href="../index.html">Volver al menú principal</a></li>
            <li><a href="index.html">Volver al índice de formularios</a></li>
        </ul>
    </nav>
    <main>
        <form action="#" method="post">
            <fieldset>
                <legend>Datos Personales</legend>
                <label for="nom">Nombre:</label><br>
                <input type="text" id="nom" name="nombre"><br>
                <label for="ape">Apellidos:</label><br>
                <input type="text" id="ape" name="apellidos"><br>
                <label for="dni">DNI:</label><br>
                <input type="text" id="dni" name="dni"><br>
                <label for="loc">Localidad de Nacimiento:</label><br>
                <input type="text" id="loc" name="localidad"><br>
                <label for="prov">Provincia:</label><br>
                <select id="prov" name="provincia">
                    <option value="Huelva">Huelva</option>
                    <option value="Sevilla">Sevilla</option>
                </select><br>
                <label for="fecha_nac">Fecha de Nacimiento:</label><br>
                <input type="date" id="fecha_nac" name="fecha_nacimiento"><br>
                <label for="dir">Dirección:</label><br>
                <input type="text" id="dir" name="direccion"><br>
                <label for="cp">Código Postal:</label><br>
                <input type="text" id="cp" name="cp">
            </fieldset>

            <fieldset>
                <legend>Forma de Acceso</legend>
                <input type="radio" id="directo" name="acceso" value="directo">
                <label for="directo">Directo</label><br>
                <input type="radio" id="prueba" name="acceso" value="prueba_libre">
                <label for="prueba">Prueba Libre</label><br><br>
                
                <input type="radio" id="bach" name="acceso_directo" value="bachillerato">
                <label for="bach">Bachillerato Log Mod</label>
                <input type="text" name="nota_bachillerato"><br>
                <input type="radio" id="exp" name="acceso_directo" value="experimental">
                <label for="exp">Experimental</label><br>
                <input type="radio" id="cou" name="acceso_directo" value="cou">
                <label for="cou">COU Opción</label>
                <input type="text" name="nota_cou"><br>
                <input type="radio" id="fp2" name="acceso_directo" value="fp2">
                <label for="fp2">FP2</label><br>
                <input type="radio" id="otros" name="acceso_directo" value="otros">
                <label for="otros">Otros (especifique)</label>
                <input type="text" name="otros_especifique">
            </fieldset>

            <fieldset>
                <legend>Documentos Adjuntados</legend>
                <input type="checkbox" id="foto" name="documentos" value="fotocopia">
                <label for="foto">Fotocopia DNI</label><br>
                <input type="checkbox" id="cert" name="documentos" value="certificado">
                <label for="cert">Certificado Académico</label><br>
                <input type="checkbox" id="otros_doc" name="documentos" value="otros">
                <label for="otros_doc">Otros documentos (especifique)</label>
                <input type="text" name="otros_doc_texto">
            </fieldset>

            <button type="submit">Enviar Solicitud</button>
            <button type="reset">Limpiar datos</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Javier Gonzalez Jimenez </p>
    </footer>
</body>
</html>
</body>
</html>
