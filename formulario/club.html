<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Tu Nombre">
    <meta name="description" content="Cuestionario club informática">
    <meta name="keywords" content="club, informatica">
    <title>Amigos de la informática</title>
    <style>
        body {
            background-color: #f4f1ea;
            font-family: Arial, sans-serif;
            color: #333;
        }
        h1 {
            color: #ffb7b2; /* Rosa pastel */
        }
        fieldset {
            background-color: #ffffff;
            border: 2px solid #ffd3b6; /* Borde melocotón */
            padding: 15px;
            margin-bottom: 15px;
        }
        legend {
            color: #ffcba4;
            font-weight: bold;
        }
        input, textarea, select {
            margin-bottom: 10px;
            padding: 5px;
            background-color: #fafafa;
            border: 1px solid #ccc;
        }
        button {
            background-color: #a8e6cf; /* Verde menta */
            padding: 10px 20px;
            border: 1px solid #8fd3b8;
            cursor: pointer;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Rellena el cuestionario del club "Amigos de la informática"</h1>
    </header>
    <nav>
        <ul>
            <li><a href="../index.html">Volver al menú principal</a></li>
            <li><a href="index.html">Volver al índice de formularios</a></li>
        </ul>
    </nav>
    <main>
        <form action="#" method="post">
            <fieldset>
                <legend>Datos personales</legend>
                <label for="nom2">Nombre:</label><br>
                <input type="text" id="nom2" name="nombre"><br>
                <label for="dom">Domicilio:</label><br>
                <input type="text" id="dom" name="domicilio"><br>
                <label for="pais">País de origen:</label><br>
                <select id="pais" name="pais">
                    <option value="España">España</option>
                    <option value="Mexico">México</option>
                    <option value="Argentina">Argentina</option>
                </select><br>
                <label for="fnac2">Fecha de nacimiento:</label><br>
                <input type="date" id="fnac2" name="fecha_nacimiento"><br>
                <label for="correo">Correo electrónico:</label><br>
                <input type="email" id="correo" name="correo"><br>
                <label for="tel2">Teléfono:</label><br>
                <input type="tel" id="tel2" name="telefono"><br>

                <label>Estado civil:</label><br>
                <input type="radio" id="soltero" name="estado_civil" value="soltero"><label for="soltero">Solter@</label>
                <input type="radio" id="casado" name="estado_civil" value="casado"><label for="casado">Casad@</label>
                <input type="radio" id="separado" name="estado_civil" value="separado"><label for="separado">Separa@</label>
                <input type="radio" id="viudo" name="estado_civil" value="viudo"><label for="viudo">Viud@</label><br><br>

                <label>Sexo:</label><br>
                <input type="radio" id="hombre" name="sexo" value="hombre"><label for="hombre">Hombre</label>
                <input type="radio" id="mujer" name="sexo" value="mujer"><label for="mujer">Mujer</label>
            </fieldset>

            <fieldset>
                <legend>Otra información de interés</legend>
                <label for="dispositivo">Componentes electrónicos que usa:</label><br>
                <select id="dispositivo" name="dispositivo" multiple size="4">
                    <option value="movil">Móvil</option>
                    <option value="tablet">Tablet</option>
                    <option value="ordenador">Ordenador</option>
                    <option value="ebook">Ebook</option>
                </select><br>

                <label>Actividades favoritas:</label><br>
                <input type="checkbox" id="deporte" name="actividades" value="deporte"><label for="deporte">Hacer deporte</label><br>
                <input type="checkbox" id="amigos" name="actividades" value="amigos"><label for="amigos">Salir con amigos</label><br>
                <input type="checkbox" id="series" name="actividades" value="series"><label for="series">Ver series</label><br>
                <input type="checkbox" id="rutas" name="actividades" value="rutas"><label for="rutas">Senderismo</label><br>
                <input type="checkbox" id="cine" name="actividades" value="cine"><label for="cine">Ir al cine</label><br>
                <input type="checkbox" id="musica" name="actividades" value="musica"><label for="musica">Escuchar música</label><br><br>

                <label for="motivo">Motivo para ingresar:</label><br>
                <textarea id="motivo" name="motivo" rows="4"></textarea><br>

                <label for="peli">Tu peli favorita:</label><br>
                <input type="text" id="peli" name="peli_favorita">
            </fieldset>

            <button type="submit">Enviar</button>
            <button type="reset">Cancelar</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Javier Gonzalez Jimenez</p>
    </footer>
</body>
</html>
